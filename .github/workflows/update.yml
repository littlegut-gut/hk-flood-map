name: Update Rainfall History

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python accumulate_rainfall.py
      - run: cp data/rainfall_history.json docs/data/rainfall_history.json
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/rainfall_history.json
          if git diff --staged --quiet; then
            echo "無變化，跳過提交"
          else
            git commit -m "Auto update rainfall: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi